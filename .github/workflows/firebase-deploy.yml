name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            functions/package-lock.json
            shared/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: feefo-reviews
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FEEFO_REVIEWS }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install shared dependencies
        run: npm ci --prefix shared

      - name: Build shared package
        run: npm --prefix shared run build

      - name: Copy shared package into functions workspace
        run: node scripts/copy-shared.js

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Create frontend environment file
        env:
          FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
        run: |
          {
            echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=feefo-reviews"
            echo "NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}"
            echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=feefo-reviews.firebaseapp.com"
            echo "NEXT_PUBLIC_FUNCTIONS_URL=https://us-central1-feefo-reviews.cloudfunctions.net"
          } > app/.env.local

      - name: Create production functions environment file
        env:
          FEEFO_UNI_ID: ${{ secrets.FEEFO_UNIWORLD_CLIENT_ID }}
          FEEFO_UNI_SECRET: ${{ secrets.FEEFO_UNIWORLD_CLIENT_SECRET }}
          FEEFO_LG_ID: ${{ secrets.FEEFO_LUXURY_GOLD_CLIENT_ID }}
          FEEFO_LG_SECRET: ${{ secrets.FEEFO_LUXURY_GOLD_CLIENT_SECRET }}
          V_ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          V_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          V_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          V_ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          V_REQUIRE_ADMIN_CLAIM: ${{ secrets.REQUIRE_ADMIN_CLAIM }}
          V_SYNC_API_TOKEN: ${{ secrets.SYNC_API_TOKEN }}
          V_CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          V_REVIEWS_API_SECRET_PEPPER: ${{ secrets.REVIEWS_API_SECRET_PEPPER }}
        run: |
          {
            echo "FEEFO_UNIWORLD_CLIENT_ID=${FEEFO_UNI_ID}"
            echo "FEEFO_UNIWORLD_CLIENT_SECRET=${FEEFO_UNI_SECRET}"
            echo "FEEFO_LUXURY_GOLD_CLIENT_ID=${FEEFO_LG_ID}"
            echo "FEEFO_LUXURY_GOLD_CLIENT_SECRET=${FEEFO_LG_SECRET}"
          } > functions/.env.feefo-reviews
          [ -n "${V_ADMIN_EMAILS}" ] && echo "ADMIN_EMAILS=${V_ADMIN_EMAILS}" >> functions/.env.feefo-reviews || true
          [ -n "${V_ANTHROPIC_API_KEY}" ] && echo "ANTHROPIC_API_KEY=${V_ANTHROPIC_API_KEY}" >> functions/.env.feefo-reviews || true
          [ -n "${V_ALGOLIA_APP_ID}" ] && echo "ALGOLIA_APP_ID=${V_ALGOLIA_APP_ID}" >> functions/.env.feefo-reviews || true
          [ -n "${V_ALGOLIA_ADMIN_KEY}" ] && echo "ALGOLIA_ADMIN_KEY=${V_ALGOLIA_ADMIN_KEY}" >> functions/.env.feefo-reviews || true
          [ -n "${V_REQUIRE_ADMIN_CLAIM}" ] && echo "REQUIRE_ADMIN_CLAIM=${V_REQUIRE_ADMIN_CLAIM}" >> functions/.env.feefo-reviews || true
          [ -n "${V_SYNC_API_TOKEN}" ] && echo "SYNC_API_TOKEN=${V_SYNC_API_TOKEN}" >> functions/.env.feefo-reviews || true
          [ -n "${V_CORS_ALLOWED_ORIGINS}" ] && echo "CORS_ALLOWED_ORIGINS=${V_CORS_ALLOWED_ORIGINS}" >> functions/.env.feefo-reviews || true
          [ -n "${V_REVIEWS_API_SECRET_PEPPER}" ] && echo "REVIEWS_API_SECRET_PEPPER=${V_REVIEWS_API_SECRET_PEPPER}" >> functions/.env.feefo-reviews || true

      - name: Build frontend
        run: npm --prefix app run build

      - name: Deploy Hosting, Functions, and Firestore rules + indexes
        run: firebase deploy --project feefo-reviews --only functions,hosting,firestore --non-interactive
