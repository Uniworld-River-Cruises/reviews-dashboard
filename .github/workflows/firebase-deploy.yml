name: Deploy Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            functions/package-lock.json
            shared/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: feefo-reviews
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FEEFO_REVIEWS }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install shared dependencies
        run: npm ci --prefix shared

      - name: Build shared package
        run: npm --prefix shared run build

      - name: Copy shared package into functions workspace
        run: node scripts/copy-shared.js

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Create frontend environment file
        run: |
          cat <<EOF > app/.env.local
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=feefo-reviews
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=feefo-reviews.firebaseapp.com
          NEXT_PUBLIC_FUNCTIONS_URL=https://us-central1-feefo-reviews.cloudfunctions.net
          EOF

      - name: Create production functions environment file
        run: |
          cat <<EOF > functions/.env.feefo-reviews
          FEEFO_UNIWORLD_CLIENT_ID=${{ secrets.FEEFO_UNIWORLD_CLIENT_ID }}
          FEEFO_UNIWORLD_CLIENT_SECRET=${{ secrets.FEEFO_UNIWORLD_CLIENT_SECRET }}
          FEEFO_LUXURY_GOLD_CLIENT_ID=${{ secrets.FEEFO_LUXURY_GOLD_CLIENT_ID }}
          FEEFO_LUXURY_GOLD_CLIENT_SECRET=${{ secrets.FEEFO_LUXURY_GOLD_CLIENT_SECRET }}
          EOF
          if [ -n "${{ secrets.ADMIN_EMAILS }}" ]; then
            echo "ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}" >> functions/.env.feefo-reviews
          fi
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> functions/.env.feefo-reviews
          fi
          if [ -n "${{ secrets.ALGOLIA_APP_ID }}" ]; then
            echo "ALGOLIA_APP_ID=${{ secrets.ALGOLIA_APP_ID }}" >> functions/.env.feefo-reviews
          fi
          if [ -n "${{ secrets.ALGOLIA_ADMIN_KEY }}" ]; then
            echo "ALGOLIA_ADMIN_KEY=${{ secrets.ALGOLIA_ADMIN_KEY }}" >> functions/.env.feefo-reviews
          fi
          if [ -n "${{ secrets.REQUIRE_ADMIN_CLAIM }}" ]; then
            echo "REQUIRE_ADMIN_CLAIM=${{ secrets.REQUIRE_ADMIN_CLAIM }}" >> functions/.env.feefo-reviews
          fi
          if [ -n "${{ secrets.SYNC_API_TOKEN }}" ]; then
            echo "SYNC_API_TOKEN=${{ secrets.SYNC_API_TOKEN }}" >> functions/.env.feefo-reviews
          fi

      - name: Build frontend
        run: npm --prefix app run build

      - name: Deploy Hosting and Functions
        run: firebase deploy --project feefo-reviews --only functions,hosting --non-interactive
